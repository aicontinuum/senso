# Hardware watchdog. systemd pets the Pi's hardware watchdog (/dev/watchdog)
# every RuntimeWatchdogSec/2. If the system ever freezes hard enough that
# systemd can't pet it in time — kernel hang, total lock-up — the hardware
# forcibly resets the Pi. This is the only thing that recovers a fully-frozen
# gateway; the software net-watchdog can't run if the OS itself is wedged.
#
# Installed to /etc/systemd/system.conf.d/senso-watchdog.conf
[Manager]
RuntimeWatchdogSec=15s
RebootWatchdogSec=2min
